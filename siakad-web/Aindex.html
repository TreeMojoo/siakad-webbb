#v.t>*{animation:fi .3s both}@keyframes fi{from{opacity:0;transform:translateY(8px)}}.m{animation:fi .25s}

nilai(){const mine=D.kelas.filter(c=>U.role!="dosen"||c.d==U.id);if(!mine.some(c=>c.id==S.k))S.k=mine[0]?.id;const rows=D.krs.filter(k=>k.kl==S.k&&k.s=="Disetujui");
return `<div class="card"><label>Kelas </label><select id="selk">${mine.map(c=>`<option value="${c.id}" ${c.id==S.k?"selected":""}>${c.id} - ${esc(mk(c.mk).n)}</option>`).join("")}</select><p class="k">Nilai akhir = 30% tugas + 30% UTS + 40% UAS. Hanya KRS berstatus Disetujui yang dapat dinilai.</p></div>
<div class="card w"><table><tr><th>NIM</th><th>Nama</th><th>Tugas</th><th>UTS</th><th>UAS</th><th>Akhir</th><th>Huruf</th><th></th></tr>${rows.map(k=>{const n=D.nilai.find(x=>x.krs==k.id)||{};return `<tr><td>${esc(k.nim)}</td><td>${esc(mh(k.nim)?.nama)}</td>${["t","u","a"].map(f=>`<td><input class="n" type="number" min="0" max="100" id="${f}_${k.id}" value="${n[f]??""}"></td>`).join("")}<td id="af_${k.id}">${n.f??"-"}</td><td id="ah_${k.id}">${n.h??"-"}</td><td><button class="b" data-a="sn" data-i="${k.id}">Simpan</button></td></tr>`}).join("")||"<tr><td>Belum ada peserta disetujui</td></tr>"}</table></div>`},
khs(){let sk=0,mu=0;const rows=D.krs.filter(k=>k.nim==S.m).map(k=>({k,n:D.nilai.find(x=>x.krs==k.id)})).filter(r=>r.n);
rows.forEach(r=>{const s=sksOf(r.k);sk+=s;mu+=s*r.n.b});const m=mh(S.m)||{};
return `<div class="card">${U.role=="mhs"?"":`<label>Mahasiswa </label><select id="selm">${optM()}</select> `}<button class="s" data-a="pr">Cetak</button></div>
<div class="card"><h3>Kartu Hasil Studi</h3><p>${esc(m.nim)} - ${esc(m.nama)} - ${esc(pr(m.p)?.n)}</p><div class="w"><table><tr><th>Kode</th><th>Mata kuliah</th><th>SKS</th><th>Nilai</th><th>Huruf</th><th>Bobot</th><th>Mutu</th></tr>${rows.map(({k,n})=>{const c=kl(k.kl),s=sksOf(k);return `<tr><td>${c.mk}</td><td>${esc(mk(c.mk).n)}</td><td>${s}</td><td>${n.f}</td><td>${n.h}</td><td>${n.b.toFixed(2)}</td><td>${(s*n.b).toFixed(2)}</td></tr>`}).join("")||"<tr><td>Belum ada nilai</td></tr>"}</table></div><p>Total SKS: <b>${sk}</b></p>${(ip=>`<div class="ipk" style="color:${ip>=3.5?"var(--ok)":ip>=2.5?"var(--ac)":"var(--bad)"}">IPK <span data-n="${ip.toFixed(2)}">0</span> <span class="pill">${ip>=3.5?"Sangat memuaskan":ip>=3?"Memuaskan":ip>=2?"Cukup":"Perlu perbaikan"}</span></div>`)(sk?mu/sk:0)}</div>`}};
const render=()=>{if(!U){$("#nav").innerHTML="";$("#v").innerHTML=V.login();return}if(!ROLE[U.role].includes(cur))cur=ROLE[U.role][0];if(U.role=="mhs")S.m=U.id;$("#nav").innerHTML=ROLE[U.role].map(k=>`<button data-a="tab" data-i="${k}" class="${k==cur?"on":""}">${lab(k)}</button>`).join("")+`<button class="s" data-a="out" style="margin-left:auto">Keluar (${esc(U.id)})</button>`;$("#v").className="";$("#v").innerHTML=V[cur]();fx()};
function fx(){document.querySelectorAll("[data-n]").forEach(e=>{const n=+e.dataset.n,d=n%1?2:0,t0=performance.now();(function s(t){const p=Math.min(1,(t-t0)/700);e.textContent=(n*p).toFixed(d);if(p<1)requestAnimationFrame(s)})(t0)});requestAnimationFrame(()=>document.querySelectorAll("i[data-w]").forEach(i=>i.style.width=i.dataset.w))}
const A={
tab(i){cur=i;render();$("#v").className="t"},
sm(){const g=i=>$("#f_"+i).value.trim(),nim=S.ed||g("nim");if(!nim||!g("nama"))return note("NIM dan nama wajib diisi",false);
 if(!S.ed&&mh(nim))return note("NIM sudah terdaftar",false);
 const o={nim,nama:g("nama"),jk:g("jk"),ang:+g("ang"),p:g("p"),w:g("w"),tgl:"",al:""};
 if(S.ed)Object.assign(mh(nim),o);else D.mhs.push(o);S.ed=null;save();render();note("Data mahasiswa tersimpan")},
em(i){S.ed=i;render()},cm(){S.ed=null;render()},
dm(i){if(D.krs.some(k=>k.nim==i))return note("Tidak dapat dihapus: mahasiswa memiliki data KRS",false);if(!confirm("Hapus mahasiswa "+i+"?"))return;D.mhs=D.mhs.filter(m=>m.nim!=i);save();render();note("Mahasiswa dihapus")},
ak(i){if(U.role!="mhs")return;S.m=U.id;const my=D.krs.filter(k=>k.nim==S.m),c=kl(i),s=mk(c.mk).sks;
 if(my.some(k=>k.kl==i))return note("Kelas sudah diambil",false);
 if(full(i)>=c.kuota)return note("Kuota kelas penuh",false);
 const b=my.find(k=>{const o=kl(k.kl);return o.hari==c.hari&&o.jam==c.jam});if(b)return note("Jadwal bentrok dengan kelas "+b.kl,false);
 if(my.reduce((a,k)=>a+sksOf(k),0)+s>24)return note("Total SKS melebihi batas 24",false);
 D.krs.push({id:"KRS"+String(Math.max(0,...D.krs.map(k=>+k.id.slice(3)))+1).padStart(3,"0"),nim:S.m,kl:i,tgl:new Date().toISOString().slice(0,10),s:"Menunggu"});save();render();note("Kelas ditambahkan, menunggu persetujuan dosen wali")},
ap(i){const k=D.krs.find(x=>x.id==i);if(U.role!="dosen"||mh(k.nim)?.w!=U.id)return note("Hanya dosen wali mahasiswa tersebut yang dapat menyetujui",false);if(full(k.kl)>=kl(k.kl).kuota)return note("Kuota kelas penuh, tidak dapat disetujui",false);k.s="Disetujui";save();render();note("KRS disetujui")},
bk(i){const k=D.krs.find(x=>x.id==i);if(!k||U.role!="mhs"||k.nim!=U.id)return note("Hanya pemilik KRS yang dapat membatalkan",false);if(D.nilai.some(n=>n.krs==i))return note("KRS sudah memiliki nilai, tidak dapat dibatalkan",false);D.krs=D.krs.filter(x=>x.id!=i);save();render();note("KRS dibatalkan")},
sn(i){const v=f=>$("#"+f+"_"+i).value,r=["t","u","a"].map(f=>v(f));if(r.some(x=>x===""||+x<0||+x>100))return note("Nilai harus 0-100 dan terisi semua",false);
 const [t,u,a]=r.map(Number),f=Math.round((.3*t+.3*u+.4*a)*100)/100,[h,b]=gr(f);let n=D.nilai.find(x=>x.krs==i);
 if(!n){n={id:"NIL"+String(D.nilai.length+1).padStart(3,"0"),krs:i};D.nilai.push(n)}Object.assign(n,{t,u,a,f,h,b});save();render();note("Nilai tersimpan: "+f+" ("+h+")")},
pr(){print()},so(k){S.sd=S.so==k?-S.sd:1;S.so=k;render()},
login(){const u=$("#lu").value.trim(),p=$("#lp").value;let r=u=="admin"?"admin":mh(u)?"mhs":ds(u)?"dosen":null;if(!r||p!=u)return note("Username atau password salah",false);U={role:r,id:u};try{sessionStorage.setItem("siakad_u",JSON.stringify(U))}catch(e){}cur=ROLE[r][0];render();note("Selamat datang, "+(r=="mhs"?mh(u).nama:r=="dosen"?ds(u).n:"Admin"))},
out(){U=null;try{sessionStorage.removeItem("siakad_u")}catch(e){}render()}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b)A[b.dataset.a](b.dataset.i);if(e.target.id=="th"){const r=document.documentElement;r.dataset.theme=(r.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))=="dark"?"light":"dark"}if(e.target.id=="rs"&&confirm("Kembalikan semua data ke data awal?")){try{localStorage.removeItem(KEY)}catch(x){}location.reload()}});
document.addEventListener("input",e=>{const x=e.target;if(x.id=="q"){S.q=x.value;render();const q=$("#q");q.focus();q.setSelectionRange(q.value.length,q.value.length);return}const m=/^[tua]_(KRS\d+)$/.exec(x.id);if(m){const v=f=>+$("#"+f+"_"+m[1]).value,f=Math.round((.3*v("t")+.3*v("u")+.4*v("a"))*100)/100;$("#af_"+m[1]).textContent=f;$("#ah_"+m[1]).textContent=gr(f)[0]+" (pratinjau)"}});
document.addEventListener("change",e=>{if(e.target.id=="selm"){S.m=e.target.value;render()}if(e.target.id=="selk"){S.k=e.target.value;render()}});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.id=="lp")A.login()});
render();
</script></body></html>
